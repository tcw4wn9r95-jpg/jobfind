name: Scan for job leads

on:
  schedule:
    # Deliberately NOT on the hour: GitHub's own docs warn that scheduled
    # workflows fired exactly at :00 are the most likely to be delayed or
    # dropped under load, since that's when every other repo's cron also
    # fires. 17 past avoids that spike. First-ever scheduled run (2026-07-20
    # 06:00 UTC, right after this workflow was merged) never appeared in
    # the run history at all — consistent with exactly that failure mode.
    - cron: "17 6 * * *" # daily ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Worst-case bound (every source timing out sequentially) is ~8 minutes;
    # a run stuck past that is hung, not slow. Without this it could run for
    # GitHub's default 6h job cap, tying up the shared "pages" concurrency
    # group and blocking app deploys behind it the whole time — confirmed
    # happened: a run sat in_progress for 12+ minutes with no sign of
    # finishing until cancelled by hand.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # GITHUB_REPOSITORY-based vars exist on schedule events too (event payload doesn't).
      # ADZUNA_*/JOOBLE_API_KEY are optional — those two fetchers skip
      # themselves cleanly if the corresponding secret isn't set.
      - run: SITE_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" node scanner/scan.mjs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      - name: Publish leads to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./scanner/out
          destination_dir: leads
          keep_files: false
          commit_message: "leads: daily scan"
